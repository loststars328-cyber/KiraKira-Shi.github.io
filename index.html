<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cyber · 个人名片</title>
<meta name="description" content="cyber 的个人主页 —— 每天都要进步。">
<meta name="theme-color" content="#eaf3ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a2b" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="profile">
<meta property="og:title" content="cyber · 个人名片">
<meta property="og:description" content="cyber 的个人主页 —— 每天都要进步。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">

<style>
/* ============================================================
   配色：想换整体色调，只改下面这组变量就够了
   ============================================================ */
:root{
  --bg-1:#eaf3ff;          /* 背景渐变色 1 */
  --bg-2:#f7fbff;          /* 背景渐变色 2 */
  --bg-3:#e2eeff;          /* 背景渐变色 3 */
  --blob-1:#bcd9ff;        /* 光斑颜色 */
  --blob-2:#d9e9ff;
  --blob-3:#c6e3f7;
  --card-bg:rgba(255,255,255,.62);
  --card-border:rgba(255,255,255,.8);
  --chip-bg:rgba(255,255,255,.66);
  --chip-border:rgba(150,190,235,.45);
  --text:#1e3a5f;
  --text-soft:#5d7a9c;
  --accent:#5b8fd6;
  --accent-2:#82b6ea;
  --ring:rgba(255,255,255,.85);
  --shadow:0 26px 60px -24px rgba(74,116,170,.45);
}

/* 跟随系统自动切换深色模式 */
@media (prefers-color-scheme: dark){
  :root{
    --bg-1:#0f1a2b; --bg-2:#111f33; --bg-3:#0b1420;
    --blob-1:#1c3a63; --blob-2:#16283f; --blob-3:#1a3450;
    --card-bg:rgba(22,36,56,.6);
    --card-border:rgba(140,180,225,.18);
    --chip-bg:rgba(30,48,72,.6);
    --chip-border:rgba(130,175,225,.25);
    --text:#e7f0fd;
    --text-soft:#9cb5d5;
    --accent:#7fb3ea;
    --accent-2:#5b8fd6;
    --ring:rgba(160,200,240,.25);
    --shadow:0 26px 60px -26px rgba(0,0,0,.75);
  }
}

*,*::before,*::after{box-sizing:border-box}

body{
  margin:0;
  min-height:100dvh;
  display:grid;
  /* minmax(0,1fr)：让网格轨道跟随视口宽度，而不是被卡片内容的最宽行撑开 */
  grid-template-columns:minmax(0,1fr);
  /* 两行：1fr 放名片并让它居中，auto 放页脚并把它贴到页面最底部 */
  grid-template-rows:1fr auto;
  place-items:center;
  padding:clamp(1.25rem,4vw,3rem) 1.25rem;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  line-height:1.75;
  background:linear-gradient(165deg,var(--bg-1),var(--bg-2) 52%,var(--bg-3));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------- 背景光斑 ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.75}
.b1{width:44vmax;height:44vmax;background:var(--blob-1);top:-16vmax;left:-10vmax;animation:float 18s ease-in-out infinite}
.b2{width:36vmax;height:36vmax;background:var(--blob-2);bottom:-14vmax;right:-8vmax;animation:float 22s ease-in-out infinite reverse}
.b3{width:24vmax;height:24vmax;background:var(--blob-3);top:36%;left:56%;animation:float 26s ease-in-out infinite}
@media (prefers-color-scheme: dark){ .blob{opacity:.55} }

/* ---------- 名片主体（毛玻璃） ---------- */
.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:560px;
  min-width:0;
  padding:clamp(1.9rem,5vw,2.9rem);
  text-align:center;
  border-radius:32px;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);
  transition:transform .45s cubic-bezier(.22,.9,.28,1),box-shadow .45s ease;
}
.card:hover{transform:translateY(-6px);box-shadow:0 34px 70px -26px rgba(74,116,170,.55)}

/* 卡内元素依次浮现 */
.card > *{animation:rise .75s cubic-bezier(.22,.9,.28,1) backwards}
.card > *:nth-child(1){animation-delay:.05s}
.card > *:nth-child(2){animation-delay:.12s}
.card > *:nth-child(3){animation-delay:.19s}
.card > *:nth-child(4){animation-delay:.26s}
.card > *:nth-child(5){animation-delay:.33s}
.card > *:nth-child(6){animation-delay:.40s}
.card > *:nth-child(7){animation-delay:.47s}

/* ---------- 头像 ---------- */
.avatar{
  width:110px;height:110px;
  margin:0 auto 1.15rem;
  display:grid;place-items:center;
  border-radius:50%;
  font-size:2.5rem;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border:6px solid var(--ring);
  box-shadow:0 16px 34px -14px rgba(91,143,214,.85);
  /* 若换成 <img>，这两行让它自动适配 */
  object-fit:cover;
  transition:transform .45s cubic-bezier(.22,.9,.28,1),box-shadow .45s ease;
}
.avatar:hover{transform:scale(1.05) rotate(-3deg);box-shadow:0 22px 40px -14px rgba(91,143,214,.95)}

/* ---------- 文字 ---------- */
.name{
  margin:0;
  font-size:clamp(1.6rem,5vw,2.1rem);
  font-weight:700;
  letter-spacing:.02em;
  background:linear-gradient(120deg,var(--text),var(--accent));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:var(--accent);
}

.handle{margin:.15rem 0 0;font-size:.88rem;letter-spacing:.12em;color:var(--text-soft)}

.tagline{
  margin:1.05rem auto 0;
  max-width:34em;
  font-size:1rem;
  color:var(--text-soft);
  text-wrap:pretty;
}

/* 状态小圆点（不需要就删掉 .status 这一段） */
.status{
  display:inline-flex;align-items:center;gap:.42rem;
  margin-top:1.05rem;padding:.28rem .78rem;
  font-size:.8rem;color:var(--text-soft);
  border-radius:999px;background:var(--chip-bg);border:1px solid var(--chip-border);
}
.status::before{
  content:"";width:7px;height:7px;border-radius:50%;
  background:#4fc07a;box-shadow:0 0 0 0 rgba(79,192,122,.6);animation:pulse 2.2s ease-out infinite;
}

/* ---------- 标签 ---------- */
.tags{
  display:flex;flex-wrap:wrap;justify-content:center;gap:.55rem;
  list-style:none;margin:1.35rem 0 0;padding:0;
}
.tags li{
  padding:.34rem .85rem;font-size:.84rem;color:var(--text-soft);
  border-radius:999px;background:var(--chip-bg);border:1px solid var(--chip-border);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:transform .3s ease,color .3s ease,border-color .3s ease;
}
.tags li:hover{transform:translateY(-3px);color:var(--accent);border-color:var(--accent)}

/* ---------- 链接按钮 ---------- */
.links{
  display:flex;flex-wrap:wrap;justify-content:center;gap:.65rem;
  margin:1.65rem 0 0;
}
.links a{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.62rem 1.15rem;border-radius:999px;
  font-size:.92rem;font-weight:600;text-decoration:none;
  color:var(--text);background:var(--chip-bg);border:1px solid var(--chip-border);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:transform .28s cubic-bezier(.22,.9,.28,1),box-shadow .28s ease,color .28s ease,background .28s ease;
}
.links a:hover{transform:translateY(-4px);color:var(--accent);box-shadow:0 14px 26px -14px rgba(74,116,170,.9)}
.links a svg{width:16px;height:16px;flex:none}

.links a.primary{
  color:#fff;border-color:transparent;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 14px 28px -14px rgba(91,143,214,.95);
}
.links a.primary:hover{color:#fff;box-shadow:0 20px 34px -14px rgba(91,143,214,1)}

a:focus-visible,.avatar:focus-visible{
  outline:3px solid var(--accent);outline-offset:3px;border-radius:999px;
}

/* ---------- 页脚 ---------- */
.foot{
  grid-row:2;                /* 独占页面最底部那一行 */
  margin:0;
  padding:.9rem 0 .2rem;
  font-size:.8rem;
  letter-spacing:.02em;
  text-align:center;
  color:var(--text-soft);
  opacity:.85;
  animation:rise .75s cubic-bezier(.22,.9,.28,1) .5s backwards;
}

/* ---------- 动画 ---------- */
@keyframes float{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(0,-26px,0) scale(1.07)}
}
@keyframes rise{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:none}
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(79,192,122,.55)}
  70%{box-shadow:0 0 0 8px rgba(79,192,122,0)}
  100%{box-shadow:0 0 0 0 rgba(79,192,122,0)}
}

/* 尊重系统「减少动态效果」设置 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .card:hover,.avatar:hover,.tags li:hover,.links a:hover{transform:none}
}

@media (max-width:420px){
  .avatar{width:92px;height:92px;font-size:2.1rem;border-width:5px}
  .links a{padding:.58rem 1rem;font-size:.88rem}
}
</style>
</head>

<body>
<!-- 背景光斑（纯装饰，可整块删掉） -->
<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>

<main class="card">

  <!-- ✏️ 头像：想用图片就换成
       <img class="avatar" src="avatar.jpg" alt="cyber"> -->
  <div class="avatar">S</div>

  <!-- ✏️ 你的名字 -->
  <h1 class="name">cyber</h1>

  <nav class="links">
    <a class="primary" href="https://github.com/loststars328-cyber" target="_blank" rel="noopener">

</main>

<p class="foot">© <span id="year">2026</span> loststars328-cyber</p>


<script>

  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
